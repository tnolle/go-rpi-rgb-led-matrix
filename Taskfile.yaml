version: '3'

vars:
  HOST: led

tasks:
  test:
    cmds:
      - go -C go test ./...

  terminal:
    cmds:
      - go -C go build -o ../.bin/server-terminal ./servers/terminal
      - ./.bin/server-terminal

  cli:
    cmds:
      - go -C go run ./clients/led -- {{.CLI_ARGS}}

  build:
    cmds:
      - docker exec rgbmatrix-build-arm64-1 make build
      - chmod +x .bin/led

  deploy:
    cmds:
      - ssh {{.HOST}} sudo systemctl stop led
      - scp -C .bin/led {{.HOST}}:/home/tnolle/led/led
      - ssh {{.HOST}} sudo systemctl start led

  dist:
    cmds:
      - task: build
      - task: deploy
